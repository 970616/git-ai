  name: Build
  on:
    push:
      branches:
        - main
    workflow_dispatch:
  jobs:
    linux:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
          with:
            targets: x86_64-unknown-linux-musl
        - run: sudo apt-get update && sudo apt-get install -y musl-tools
        - run: echo '' > .cargo/config.toml && cargo build --release --target x86_64-unknown-linux-musl
        - uses: actions/upload-artifact@v4
          with:
            name: git-ai-linux-x64
            path: target/x86_64-unknown-linux-musl/release/git-ai
    windows:
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
        - run: |
            echo "" > .cargo/config.toml
            cargo build --release
          shell: bash
        - uses: actions/upload-artifact@v4
          with:
            name: git-ai-windows-x64
            path: target/release/git-ai.exe
